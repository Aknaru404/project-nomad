name: Build iPad App

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Test ZimKit
        working-directory: ios/ZimKit
        run: swift test

      - name: Fetch bundled web assets
        run: bash ios/scripts/fetch-assets.sh

      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned app
        working-directory: ios
        run: |
          xcodebuild build \
            -project NOMAD.xcodeproj \
            -scheme NOMAD \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      # Sideloading tools (AltStore, Sideloadly) sign the .ipa with the user's own Apple ID on install.
      - name: Package unsigned IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NOMAD.app Payload/
          zip -qry NOMAD-unsigned.ipa Payload
          ls -lh NOMAD-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NOMAD-unsigned-ipa
          path: ios/NOMAD-unsigned.ipa
          retention-days: 30
