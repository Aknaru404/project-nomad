# XcodeGen spec: `xcodegen generate` (run from ios/) writes NOMAD.xcodeproj. Run scripts/fetch-assets.sh first.
name: NOMAD
options:
  bundleIdPrefix: us.projectnomad
  deploymentTarget:
    iOS: "17.0"
packages:
  ZimKit:
    path: ZimKit
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NOMAD:
    type: application
    platform: iOS
    sources:
      - path: NOMAD
        excludes:
          - "Info.plist"
          - "Resources/Web"
          - "Resources/Web/**"
          - "Resources/MapAssets"
          - "Resources/MapAssets/**"
          - "Resources/CyberChef"
          - "Resources/CyberChef/**"
      # Folder references keep their directory layout inside the app bundle.
      - path: NOMAD/Resources/Web
        type: folder
      - path: NOMAD/Resources/MapAssets
        type: folder
      - path: NOMAD/Resources/CyberChef
        type: folder
    dependencies:
      - package: ZimKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: us.projectnomad.NOMAD
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: NOMAD/Info.plist
      properties:
        CFBundleDisplayName: NOMAD
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Show Documents in the Files app (On My iPad > NOMAD) so large files can be copied in directly.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.openzim.zim
            UTTypeDescription: ZIM archive
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [zim]
          - UTTypeIdentifier: com.protomaps.pmtiles
            UTTypeDescription: PMTiles map
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [pmtiles]
    scheme: {}
